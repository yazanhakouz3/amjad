<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Chess</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1f2937">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      @keyframes king-check-glow {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(255, 0, 0, 0));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 8px rgba(255, 0, 0, 1)) drop-shadow(0 0 12px rgba(255, 100, 100, 0.5));
        }
      }
      .king-in-check > g > path:last-child {
          animation: king-check-glow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          transform-origin: center;
      }
      @keyframes pulse-valid-move {
        0%, 100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }
      .valid-move-indicator {
        animation: pulse-valid-move 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .fade-in-dialog {
        animation: fade-in 0.3s ease-out forwards;
      }
      @keyframes pulse-hint-from {
        0%, 100% { box-shadow: inset 0 0 0 0px rgba(59, 130, 246, 0); }
        50% { box-shadow: inset 0 0 0 5px rgba(59, 130, 246, 0.7); }
      }
      .hint-from-square {
        animation: pulse-hint-from 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-hint-to {
        0%, 100% { box-shadow: inset 0 0 0 0px rgba(34, 197, 94, 0); }
        50% { box-shadow: inset 0 0 0 5px rgba(34, 197, 94, 0.7); }
      }
      .hint-to-square {
        animation: pulse-hint-to 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes reticle-pulse {
        0%, 100% { box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.4); }
        50% { box-shadow: inset 0 0 0 5px rgba(239, 68, 68, 0.9); }
      }
      .targeting-reticle {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        animation: reticle-pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
